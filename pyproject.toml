[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "escapy"
version = "0.0.1"
description = "Lightweight escape-room game library built on pygame"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "LGPL-3.0-or-later"}
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
pygame = ["pygame>=2.0"]
dev = ["pip-tools", "ruff", "pre-commit", "pytest>=8.0"]
docs = ["sphinx>=9.0", "sphinx-rtd-theme>=3.0", "myst-parser>=5.0"]

[project.urls]
Homepage = "https://teozec.github.io/escapy"
Documentation = "https://teozec.github.io/escapy"
Repository = "https://github.com/teozec/escapy.git"
Changelog = "https://github.com/teozec/escapy/blob/master/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["src/escapy/__tests__"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"